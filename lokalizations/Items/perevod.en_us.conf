 Texts {
  "AI-2"
  "A compact first aid kit designed for providing first aid in extreme conditions. It contains essential medical supplies: bandages, antiseptics, anti-inflammatory medications, and painkillers. Ideal for survival in the Zone, it helps quickly restore health and ensure survival in harsh conditions."
  "AI-4"
  "An improved version of the AI-2 first aid kit, designed for more effective first aid in high-risk situations. Compact yet spacious, it includes an expanded set of medical supplies: sterile bandages, antiseptics, anti-inflammatory agents, and specialized medications for treating Zone-specific illnesses. This first aid kit not only restores health faster but also provides the ability to treat more serious injuries. A reliable companion for any stalker seeking to survive in dangerous conditions."
  "Alarm"
  "Container Pandora"
  "Container for storing artifacts \"Pandora\" (First prototype)"\
  ""\
  "The first in a series of high-security containers, designed for the isolation, study and preservation of objects of anomalous nature. The design is a multi-layer cocoon, providing passive neutralization of potentially dangerous properties of the contents."\
  ""\
  "Key features:"\
  ""\
  "Multi-layer body: A combination of forged titanium alloy (outer layer), lead interlayer and inner capsule made of shungite."\
  "Passive stabilization: The internal matrix of specially designed alloy absorbs kinetic, thermal and electromagnetic energy, suppressing the activity of the object."\
  ""\
  "Monitoring: Built-in sensors track temperature, pressure, radiation background and anomalous emanations inside the container"\
  ""\
  "Legacy: The first generation containers \"Pandora\" became the foundation for all subsequent models. They are valued by collectors and researchers for their reliability, ascetic design and historical significance."
