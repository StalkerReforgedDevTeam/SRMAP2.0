 Texts {
  "Search for radio equipment in the Forest"
  "We need to develop our radio communications in the region, and for that, we need equipment. There's a Malyutka radar in Les, and a lot of different equipment should have been left there."
  "Apocalypse Day"
  "War of the Marauders"
  "The Marauder War is a major conflict that broke out between many groups in the Zone. This brutal and merciless conflict completely changed the political map of the region."\
  "After the end of the war, when almost all the groups lost a significant part of their forces, and some were completely exterminated, the empty Zone was occupied by various criminal gangs, who no longer had anyone to restrain them."\
  ""\
  "Now, the stable environment of criminal groups has created new realities for stalkers: new rules, new connections and new risks. These changes inevitably affected the entire ecosystem of the Zone, making it even more dangerous and unpredictable."
  "Perimeter Security Forces (PSF)"
  "The \"PSF\" (Perimeter Security Forces) group is a specialized force created by special order of the President of the Russian Federation to guard and protect the borders of the Zone. This group includes both contract soldiers and, if necessary, can involve conscripts in emergency situations."\
  "The group mainly consists of professional contract soldiers who have undergone special training in the field of tactics and strategy of security. They have the necessary skills and experience in extreme conditions. In special cases, licensed conscripts can be involved in operations, which allows increasing the number of personnel in response to threats."\
  "The SOP regularly monitors the borders of the Zone, conducts raids and patrols to eliminate possible violations. In the event of incidents or threats, the SOP promptly responds to the situation in order to minimize risks."
  "Brigade"
  "Criminal elements, marauders and gangs that have entered the Zone for profit. Their main activity is violence, robbery, raiding of stalkers and traders. The bandits' uniforms and weapons are varied - from captured weapons to homemade devices."
  "Brigade"
  "A criminal organization led by Tufan, a former neutral who created his own gang during the Marauder War. Unlike typical bandits, the brigade adheres to certain codes and is loyal to stalkers if they behave correctly and pay the extorted \"tariffs\". It has strict internal discipline and maintains order in the territories under its control."
  "Contour-A"
  "\"Contour-A\" is a private research organization specializing in the elimination of the consequences of man-made disasters and the development of protective technologies. Officially, it is engaged in monitoring the environmental situation and analyzing risks in areas affected by hazardous accidents."\
  ""\
  "The institute has a developed infrastructure for conducting field research, including mobile laboratories and fortified bases. The main areas of activity are the study of abnormal natural phenomena, the development of special equipment and methods for protecting personnel in extreme conditions."\
  ""\
  "The organization's activities are closed, which is due to the specifics of working in high-risk areas. \"Kontur-A\" cooperates with government agencies within the framework of programs to ensure technological safety."
  "Smugglers"
  "The Smugglers group is a union of stalkers engaged in the purchase, sale and exchange of various equipment and artifacts directly in the Zone itself. Their activities cover a wide range of goods - from weapons and armored vehicles to rare artifacts and medicines, which makes them an important part of the stalker economy."\
  "The Smugglers adhere to the philosophy that the Zone is not only a dangerous, but also a profitable place where you can benefit using your skills and ingenuity. They believe that interaction between stalkers, even in illegal forms, contributes to survival in this harsh world."\
  "The Smugglers have their own well-fortified base, located in an abandoned army warehouse near the village of Savino. This place has become the center of their operations, where they can hide from persecution and plan their further actions. The warehouse is guarded by experienced stalkers and is equipped with everything necessary to maintain trade."
  "Mercenaries"
  "Neutrals"
  "The Neutrals were one of the largest and most influential factions in the Zone, known for their mission to protect stalkers and other inhabitants from the tyranny of bandit groups. For many years, the Neutrals provided security and protected small and defenseless communities, creating a network of safe bases and shelters throughout the territory."\
  "The Neutrals sought peaceful coexistence for all stalkers, regardless of their origin and goals. They believed that the Zone should be a place for trade, knowledge exchange, and cooperation, and not a battlefield for survival."\
  "Unfortunately, as a result of internal struggle, conflicts with bandit groups, and the use of harsh methods by the authorities, the Zone was destroyed. Most of the bases were destroyed, and the Neutrals lost a large number of their members, and at the moment the group is completely destroyed."
  "Sciences"
  "Scientists are a collection of scientific groups operating in the Zone. Their activities are focused on studying anomalous phenomena, artifacts, and background radiation, but they can only be called a single group conditionally. Each group has its own goals and objectives and operates independently of the others. Below are three different scientific groups operating in the Zone."\
  "Group \"Prometheus\""\
  "Created by scientists from one of the major research institutes studying anomalous phenomena in Russia."\
  "Group \"Ural-03\""\
  "This research group consists of sociologists, ecologists, and psychologists sent to study the impact of the Zone on society, as well as human adaptation to high levels of radiation and anomalous phenomena. They specialize in developing protective equipment."\
  "Group \"SCORP\""\
  "Almost nothing is known about them, since they prefer to work from the shadows through intermediaries."
  "Light of the Zone"
  "After the emergence of the Zone, a new religious and ideological group, the Light of the Zone, appeared, which the locals simply called the Sect. The organization is based on the same patterns as Jehovah's Witnesses, where living faith, missionary activity and literal adherence to teachings are preached. The basis of the worldview of the Light of the Zone is the conviction that the Zone is a divine message and test sent to humanity for spiritual cleansing and awakening."\
  "For members of the Sect, a trip to the Zone is not just an act of survival or research, but a sacred mission, duty and purpose in life."\
  "In addition to the fact that this is another sect, of which there are quite a lot in the Russian Federation, the sect itself invests in certain scientific research that helps to reveal the essence of the Zone and actively buys artifacts from stalkers, as some sacred things for them, the organization receives money at the expense of the assets of its followers"
  "Observers"
  "Many stalkers believe in some \"Observers\" who monitor and control the Zone. However, there is no evidence that such forces exist."
  "Stalkers"
  "Isolated adventurers and treasure hunters who are not part of formal groups. Often working alone or in small temporary teams, they are guided by their own will and code. The main goal of stalkers is to explore the Zone, find valuable artifacts and survive in an extreme environment."
  "Storm"
  "The Storm group is one of the few remaining factions in the Zone that focuses on combating anomalies and mutants, as well as protecting humanity from threats emanating from the Zone. Unlike most groups, the Storm builds its organization on strictness, discipline, and a military structure, which attracts those who are ready to sacrifice themselves for the good of the community."\
  "The Storm sees its mission as protecting people from the dangers of the Zone, including mutants and other threats. They believe that only united efforts can help humanity overcome the challenges that arise in this harsh world."\
  "The group has a strict hierarchy based on military discipline. Each member is assigned specific roles and tasks, which ensures the effectiveness of operations."\
  "After the Marauder War, the Storm was significantly weakened and became extremely small in number. Many fighters died or fled, leaving only a small group that still adheres to its ideals."
  "Zombified"
  "People exposed to strong psi-radiation or telepathic beings. Absolutely aggressive."
  "Chemical zone"
  "A dangerous area saturated with toxic substances and radioactive materials, where every step can be the last for an unwary traveler. Once in this zone, players begin to be exposed to various chemicals, which leads to a gradual accumulation of \"toxins\" - a parameter that can quickly reduce the health and performance of the character."
  "Electro"
  "An electrical anomaly, one of the most common in the Zone."
  "Elementals"
  "Clots of anomalous energy that are drawn to living organisms. They can either appear on their own or form in an anomaly. They are very dangerous and can explode upon contact. So far, only fire and electric elementals have been observed."
  "Spark"
  "Fireball"
  "Eye"
  "Some stalkers believe that the Observers monitor what is happening in the Zone through the Eye anomaly. When approaching it, stalkers lose their minds."
  "Fire bubble"
  "Known for forming a fire elemental when approached."
  "Glasses"
  "Gravi"
  "A gravitational anomaly that deals damage with unknown gravitational forces."
  "Meatgrinder"
  "An anomaly that tears any creature to shreds. One of the most terrifying in the Zone."
  "Hunger and thirst"
  "It is important to remember that everyone in the Zone needs to eat and drink. The corresponding parameters are displayed on your HUD. If one of the parameters is critically low, the player will receive damage, up to and including death."
  "Burner"
  "An anomaly that causes severe thermal burns."
  "Local Storm"
  "A local anomalous zone in which lightning strikes constantly occur."
  "Miracle"
  "An extremely insidious anomaly that can either help a stalker in a difficult situation or cause irreparable harm."
  "Money and Trade"
  "In the Zone, all trade is carried out in virtual rubles, which are tied to your PDA. No PDA - no money."\
  "Just in case, I recommend keeping part of your savings in some kind of hiding place in cash, so that in case of loss of the PDA you will not be left without money."
  "Midge Swarm"
  "It is not an anomaly, but it is an interesting phenomenon. A swarm of insects, subjected to the anomalous influence of the Zone, which in a matter of seconds eat everything that is within their radius of visibility."
  "PSI field"
  "An anomalous zone filled with psychotropic radiation that has a destructive effect on the mental state of people. This effect can be extremely dangerous: constant exposure to the PSI field leads to a deterioration in the player's \"Psyche\" parameter. If the player completely loses his psyche, he begins to transform into a zombie - a helpless creature prone to aggression and having lost all human traits."
  "Psyche"
  "If your mental state is low, there is a risk that after death you will become a zombie."
  "Radiation"
  "Ionizing radiation, which is a stream of high-energy photons and particles that have a detrimental effect on living organisms. Use a dosimeter to determine the level of contamination. If radiation accumulates strongly, the character will begin to lose health."
  "Pay close attention to the radiation level around you. If you get too much radiation, the player will start losing health and black spots will appear on the screen, affecting your vision."
  "Burnt Fuzz"
  "An extremely insidious anomaly, apparently some kind of mutated local plant. It does not tolerate sunlight and grows only in dark places (buildings, caves). It is highly inadvisable to come into contact with it, as its thin stems can cut through even the most armored suit and cause profuse bleeding."
  "Fruit Punch"
  "An anomaly that causes severe chemical burns."
  "Blowout"
  "The exact causes of this phenomenon are unknown, but it is known that it kills everything on the surface. You should only take shelter in well-protected basements and in the Vault."
  "Teleport"
  "An anomaly capable of moving bodies that fall into it to specific points in the Zone. There are several types of this anomaly, differing from each other in appearance and manifestation of properties."
  "Acid sweat"
  "Acid sweat is a rare but extremely dangerous meteorological phenomenon caused by the release of a huge amount of aggressive chemical compounds from the depths of the Zone."
  "Toxication"
  "There are a number of anomalies, mutants and objects in the Zone that can accumulate a level of toxins in your body. An antitoxin will help remove the infection. If the infection level is too high, a green veil will interfere with your view."
  "Springboard"
  "Weightlessness"
  "At first glance, a harmless anomaly that forms a zone of complete absence of gravity around itself, but you need to be careful."
  "Military airfield"
  "The airfield's special feature is the abandoned and partially destroyed military helicopters, which have long since stopped flying, but still bear traces of the hasty evacuation and panic that engulfed this region on the eve of the disaster. The helicopters attract both stalkers and smugglers who seek to find spare parts and fuel supplies in them. The airfield is surrounded by dense thickets and excellent visibility, which makes it a favorable observation point, but at the same time an easy target for mutants and bandits. Anomalies are often encountered here, as well as small groups of mutated game and aggressive rats."
  "Anteroom"
  "The region directly adjacent to the Perimeter, belonging to the Mainland. The last \"outpost\" of security is located here, a zone of relative calm for stalkers and other residents before entering the dangerous Zone. The Antechamber contains trading points, security bases, repair shops and stalker training centers. Local residents and stalkers lead an active life here, preparing for expeditions to the Zone and recuperating after them."
  "Forest"
  "A vast, densely overgrown area that has become a symbol of the Zone's mysteries and dangers. Tall trees form a dense canopy that absorbs light and sound, creating impenetrable darkness and gloom. An atmosphere of surveillance dominates this forest, as if someone or something is constantly watching every traveler. In the middle of the forest rises the giant Voskhod Radar Station - a large complex that remains one of the Zone's mysteries. In the depths of the forest live both dangerous mutants and rare anomalies, the mass of anomalous manifestations makes this place especially dangerous."
  "Gorkiy-12"
  "A small settlement, next to which is located the Gorizont radar station - a Russian over-the-horizon radar station, built in haste after the collapse of the USSR in an attempt to compensate for the loss of the Duga radar. The center of military and scientific activity in the region."
  "Chernoveshchensk region"
  "Chernoveshchensk Oblast is a federal subject of the Russian Federation located beyond the Urals, where a special economic zone has existed since 1993. While the rest of Russia was experiencing hardship and unrest associated with the collapse of the USSR, Chernoveshchensk became a symbol of stability, demonstrating exemplary life in the face of ongoing crisis throughout the country."
  "Ashlands"
  "An unexplored region, which only a few have visited. As they say, this area has abnormally high temperatures, which causes constant fires and is completely unsuitable for life."
  "Polygon"
  "A closed military testing ground where various tests of new energy sources were carried out."
  "Savino"
  "This settlement is considered a kind of portal to the Zone: it is here that stalkers come to enter or leave the territory of anomalies. Savino is called the \"Grey Zone\" - here the anomalous activity is minimal, and the area has not yet been transformed by the Zone, which makes it a border between the relatively safe outside world and the dangerous territory of the Zone. Flora and fauna are lively here - many animals and mutants try to live here because of less danger and aggression. Control from the Russian Federation is practically absent, a free and chaotic order reigns here."
  "Shelter"
  "A safe place that can be considered a home for stalkers. It is located somewhere underground, and therefore is completely protected from the Surge."
  "Swamp"
  "A swampy and unpredictable region bordering the Perimeter. The area is extremely unsuitable for passage due to constant changes in the relief caused by the movement of groundwater and a high probability of losing one's bearings. Previously, this place was famous for the frequent disappearances of fishermen and mushroom pickers. Now the swamps are inhabited by many mutants and dangerous anomalies, which makes penetration here extremely risky."
  "Udarnik"
  "The industrial heart of Chernoveshchensk, this region includes coal mines, a quarry, a gas distribution plant, a chemical plant, and more."
  "Funnel"
  "One of the most mysterious and dangerous anomalous zones in the area. Formed as a result of a powerful energy release, the nature of which still sparks debate among scientists and stalkers."
  "Bichura"
  "Bichurs are the result of the Surge's direct impact on the human body. A powerful psi-pulse doesn't kill the victim, but rather burns out the cerebral cortex, leaving only the basic functions of the brain stem—aggression and motor reflexes. They are neither alive nor dead—they are biological automatons."\
  "Important: Bichurs under Telepach's control become a completely different threat. Destroying the controller instantly returns them to a chaotic state, significantly reducing the danger."
  "Boar"
  "The mutated boar is a terrifying combination of a normal wild animal and the effects of radiation. These creatures have become the largest predators in their biome, possessing terrifying strength and incredible vitality. Their appearance in the fields is enough to cause fear among survivors and wanderers, as they pose a real threat to anyone who dares to cross their path."
  "Busher"
  "Rumor has it that it is a kind of mutation of the stick insect, which can blend into its surroundings by disguising itself as a twig."
  "Yorb"
  "This mutant has not yet been studied."
  "Night Stalker"
  "One of the most dangerous creatures, practically invisible to the human eye, moves absolutely silently and causes colossal damage when approaching."
  "Phantom"
  "Perhaps this is just another Zone tale, or perhaps another of its ugly phenomena."
  "Telepach"
  "Telepach is the result of a long-term mutation in individuals who survived several Surges and possessed initially developed latent psi-abilities. Their brains weren't destroyed—they were reborn, developing previously unknown regions responsible for telepathic influence and the generation of protective fields."\
  "Special Observation: Cases of short-term mental control over weak-willed stalkers have been recorded."\
  ""\
  "Special Observation: Cases of short-term mental control over weak-willed stalkers have been recorded."
  "Rats"
  "Common rats that have proliferated in the Zone, becoming a threat to stalkers. In conditions of resource shortages, high radiation levels and a dangerous environment, they have adapted and become more aggressive"
  "Shaman"
  "This mutant's main danger is its anomalous psychokinetic activity. The creature doesn't use its own weapons. Instead, it scans the area within a 50-meter radius, detecting any firearms and using its abilities to fire them at stalkers."
  "Spider"
  "Spiders prefer dark and damp places, such as abandoned buildings, underground areas, or dense vegetation. The egg clusters they leave behind can be found in secluded areas, attracting the attention of their victims. These egg globes tend to stick to surfaces, making them visible to experienced travelers."
  "Wolf"
  "It's unclear how this species arrived in the area, as it had never previously inhabited the Chernoveshchensk area."\
  "They pose a significant danger to lone travelers, as they travel in large packs, chasing their prey into traps."
  "Faction only:"
  "Join Storm"
  "As you already know, we are in dire need of recruits. You can join us if you share our ideals."\
  ""\
  "But you need to pay an entry fee, the money will go to support the entire group, including you in the future."
  "Congratulations on joining our ranks. You are now part of the Storm group."\
  ""\
  "As a member of the Storm, you will participate in operations to clear the Zone of mutants and anomalies, as well as protect the Perimeter from hostile elements. You will work together with other members of our group to achieve our goals."\
  ""\
  "You will receive tasks and orders from our command. We expect discipline and compliance with our rules from you."\
  ""\
  "As a new member, you will receive basic gear and equipment. You will also be sent to a briefing where you will be informed about our current operations and tasks."\
  ""\
  "Together, we will make the Zone safer for everyone. You are now part of the Storm, and we will work together to achieve our goals."
  "Unknown "
 }
