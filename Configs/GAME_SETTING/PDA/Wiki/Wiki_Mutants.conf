ARMST_PDA_WIKIConfig {
 m_WikiData {
  ARMST_PDA_WIKI_DATA "{65B47A4246AF9D82}" {
   m_sName "RATS"
   m_sDesc "The Zone's smallest mutant threat and usually its most overlooked, rats swarm in packs rather than fighting alone, which is exactly what makes them dangerous despite how weak any single one is. A lone rat is barely worth a bullet, but a full pack can overwhelm a stalker fast, especially one who's already low on health or ammo from something else. They tend to nest in basements, sewers, and abandoned buildings, the kind of tight, dark spaces where their numbers matter more than their size, and they're often the first sign something's been feeding well in an area, since rat infestations tend to cluster wherever there's carrion or garbage to draw them in. Most stalkers don't fear rats individually, they fear getting cornered by them with nowhere to retreat."
  }
  ARMST_PDA_WIKI_DATA "{65B47A4F8708C979}" {
   m_sName "SPIDER"
   m_sDesc "Small, fast, and unnervingly numerous, spiders in the Zone rarely attack alone, swarming instead in skittering clusters that overwhelm through speed and numbers rather than raw strength. Individually they're not much of a threat, but their bites can carry poison, stacking toxicity on top of the bleed damage from the bites themselves, which turns a fight that looked manageable into a slow drain if a stalker doesn't disengage in time. They favor dark, enclosed spaces, caves, basements, tunnels, and the telltale web strung across a doorway or passage is usually the only warning a stalker gets before walking into a nest. Most treat a spider nest the same way they'd treat rats, not worth fighting through if there's another way around, since the danger isn't any single spider, it's how fast the swarm closes in once it notices you."
  }
  ARMST_PDA_WIKI_DATA "{65B47A4E239DC3D8}" {
   m_sName "BOAR"
   m_sDesc "One of the more common mutants in the Zone, boars are aggressive, fast, and hit far harder than their size suggests, especially when they charge in packs. They're not particularly tough compared to the Zone's larger predators, but a stalker caught off guard by a sudden charge, especially in tight terrain where dodging isn't an option, can take serious damage fast. Boars tend to roam open fields and forest edges in small herds, making them one of the first real threats new stalkers learn to respect, loud, unpredictable, and willing to charge even when the odds don't favor them. Most experienced stalkers don't underestimate a boar herd just because it's an early threat, a full charge from several at once can drop an unprepared stalker just as fast as anything deeper in the Zone."
  }
  ARMST_PDA_WIKI_DATA "{69A66E3B4B6C38E3}" {
   m_sName "BUSHER"
   m_sDesc "A mutant that hides in plain sight, disguising itself as ordinary foliage until something wanders too close, at which point it lashes out before melting back into stillness. Most encounters with a Busher aren't fights, they're near-misses, a stalker walking past a patch of bushes that never moves again, unaware anything was ever there to begin with. When it does attack, the ambush hits fast and close range, catching stalkers off guard precisely because there was no warning, no shimmer or sound to give it away like most other threats in the Zone. Experienced stalkers learn to watch for bush patches that look just slightly wrong, too still, too placed, and treat any unnecessary detour around suspicious foliage as time well spent rather than paranoia."
  }
  ARMST_PDA_WIKI_DATA "{667AD241D7B0939A}" {
   m_sName "WOLF"
   m_sDesc "Pack hunters through and through, wolves rely on numbers and coordination rather than brute strength, circling and harrying a stalker from multiple angles instead of charging in blind like a boar. A lone wolf is manageable, fast but not especially tough, but a full pack working together can pin a stalker down fast, especially in open terrain where there's nowhere to put your back against a wall. They tend to roam forests and open country in territorial packs, and their howls are as much a warning as a threat, most stalkers who hear one nearby start looking for defensible ground before the pack actually shows up. What makes wolves dangerous isn't any individual bite, it's getting surrounded, a stalker who lets a pack flank them is in far worse shape than one who fights with something solid at their back."
  }
  ARMST_PDA_WIKI_DATA "{65B4A2B18B972F39}" {
   m_sName "ZOMBIE"
   m_sDesc "Not mutated so much as broken, zombies are stalkers who wandered too deep into psi anomalies or emissions and lost themselves entirely, left shambling and mindless, driven by whatever fragments of instinct remain. They're slow and individually weak, easy to outrun or outmaneuver, but that doesn't make them harmless, zombies often still carry a weapon and will use it on reflex, and a stalker caught off guard at close range or swarmed by several at once can still take real damage from something that looks like an easy kill. What unsettles most stalkers isn't the threat, it's the reminder, every zombie was a stalker once, and running into one is as much a warning about the Zone's psychic dangers as it is a fight."
  }
  ARMST_PDA_WIKI_DATA "{66B0A391CFEA65AA}" {
   m_sName "YORB"
   m_sDesc "A heavier, more aggressive breed compared to standard Nightstalkers, trading some of their cousins' hit-and-run subtlety for raw durability and willingness to press an attack rather than dart away after a hit. Where a typical Nightstalker relies on speed and blink-style ambushes to strike and vanish, a Yorb takes more punishment and keeps coming, making it a fight a stalker has to actually finish rather than simply survive. They're still creatures of the shadows, ambushing from darkness and cover the same as any Nightstalker variant, but a stalker who expects the usual hit-and-run pattern and gets a sustained, tanky opponent instead is in for a rude surprise. Most experienced stalkers treat a confirmed Yorb sighting as a call to bring more firepower than usual, since outlasting one takes more than just landing the first shot."
  }
  ARMST_PDA_WIKI_DATA "{66B0A391C8C5577C}" {
   m_sName "NIGHTSTALKER"
   m_sDesc "A pack-hunting mutant defined by speed and unpredictability, capable of short bursts that make it seem like it's blinking in and out of existence as it darts between cover, striking fast and vanishing before a stalker can properly react. They favor darkness and low visibility, hunting mostly at night or in enclosed, shadowed spaces, and rely on disorientation as much as raw damage, a stalker who loses track of where the last strike came from is far more vulnerable than one who's simply outmatched in a straight fight. Individually they're not the toughest mutants in the Zone, but their hit-and-run pattern makes them hard to pin down, and a pack of them working the same ambush tactic in unison can wear a stalker's nerves down as fast as their health bar. Light sources and keeping your back to a wall go a long way against Nightstalkers, since most of their advantage disappears once they can't hide in the dark between strikes."
  }
  ARMST_PDA_WIKI_DATA "{65B46557C2C0D8E9}" {
   m_sName "CONTROLLER"
   m_sDesc "One of the most feared mutants in the Zone, not for its physical strength but for what it does to a stalker's mind before the fight even starts. A Controller can seize control of a stalker's perception and actions from a distance, disorienting them, forcing hallucinations, or in the worst cases turning a stalker's own weapon against them or their allies. It rarely engages directly, preferring to let psi-dominated victims and other mutants do the fighting while it stays back, calm and untouched, orchestrating the encounter rather than participating in it. Killing the Controller usually breaks whatever hold it has over the battlefield, but reaching it means fighting through everything it's turned against you first, which is exactly the point, a Controller doesn't need to be strong when it can make you fight yourself."
  }
  ARMST_PDA_WIKI_DATA "{664B278F8326266A}" {
   m_sName "PHANTOM"
   m_sDesc "A mutant born from psi energy rather than flesh, a Phantom exists as a flickering, semi-corporeal presence that's as much illusion as it is threat, often appearing in numbers that thin out fast once you realize half of them aren't really there. They don't hit especially hard individually, but the disorientation of fighting something that phases and duplicates makes it difficult to tell where the real danger is coming from, which is exactly the point, a stalker wasting shots on illusions is a stalker not watching the one Phantom that actually matters. They tend to appear in areas heavy with psi activity, often alongside or in the wake of something like a Controller, and most stalkers who've fought one agree the real threat isn't the damage, it's the confusion that gets you killed by something else entirely while you're distracted."
  }
  ARMST_PDA_WIKI_DATA "{68A2A2C878A0E4E8}" {
   m_sName "SHAMAN"
   m_sDesc "A mutant that doesn't fight directly so much as command the battlefield around it, ripping AKs from the ground or nearby corpses and levitating them into the air, firing on stalkers with the same lethal accuracy as if a person were still holding them. It's an unnerving fight precisely because the real threat isn't the Shaman itself, which tends to keep its distance, but the floating weapons doing its work, forcing stalkers to deal with gunfire coming from angles that don't make sense while trying to close the distance on the source. Taking out the Shaman usually drops whatever weapons it's animated, but getting to it means surviving fire from guns that shouldn't be able to shoot at all, which makes hesitation or panic far more dangerous here than in a normal firefight. Most stalkers agree a Shaman encounter is less about raw damage and more about nerve, freezing up while floating rifles track your position is how a manageable fight turns fatal fast."
  }
 }
}