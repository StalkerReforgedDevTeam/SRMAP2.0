ARMST_PDA_WIKIConfig {
 m_WikiData {
  ARMST_PDA_WIKI_DATA "{65F6CE461DD64551}" {
   m_sName "The Story of the Zone"
   m_sDesc "2013: The Great Retreat"\
   ""\
   "By 2013 the Ukrainian Military still clung to its checkpoints and fortified outposts, trying to enforce order inside the Exclusion Zone. Corruption and bribes were rampant, with soldiers often working with smugglers and stalkers for extra cash."\
   ""\
   "Then came a wave of devastating blowouts that tore through the landscape, rendering several garrisons uninhabitable overnight. With supply lines stretched and morale broken, the Military abandoned most of the interior, leaving only scattered units at the perimeter. Scientists, too, were forced to withdraw after several of their field labs were obliterated, and Clear Sky faded back into the swamps, too weak to challenge the spreading chaos."\
   ""\
   "For the first time, the Zone was truly in the hands of its inhabitants."\
   ""\
   "2014: Rise of the Factions"\
   ""\
   "As the Military collapsed inward, the power vacuum was quickly filled by rival groups."\
   ""\
   "Freedom expanded their influence, led by the outspoken and defiant Vanya, turning abandoned villages into hubs for their cause and welcoming stalkers into their ranks. Duty, reorganized under the iron hand of DJ, dug in at key bunkers, declaring that only strict order and the destruction of the Zone could save humanity. The Bandits, galvanized under the leadership of Vicktor Malenkov, surged out of the shadows to seize roads and choke points, bleeding Loners and smugglers dry."\
   ""\
   "Whispers of Monolith incursions spread southward, their sudden raids unnerving even hardened fighters, while Loners scattered further into ruined towns and forests, trying to survive between the warring powers."\
   ""\
   "2015: The Time of Struggle"\
   ""\
   "By 2015 the Zone belonged to no one and everyone. Freedom and Duty were locked in endless war, each claiming to fight for the future of humanity. Bandits ruled the lawless backroads, turning extortion and smuggling into an empire. The Monolith remained a constant terror from the north, fanatics who struck with a conviction that chilled even the bravest stalker."\
   ""\
   "Loners, scattered and nameless, kept the Zone alive in their own way, scavenging, trading, and forming fragile alliances wherever they could."\
   ""\
   "No government came to help, no scientists remained to explain, and no force on Earth could tame the Zone. Anomalies shifted daily, mutants roamed freely, artifacts promised both riches and death, and blowouts reminded everyone that survival was never guaranteed."\
   ""\
   "In this world of fear and ambition, the Zone itself was the only true master, and it waited patiently for all who dared to walk within its borders."
  }
  ARMST_PDA_WIKI_DATA "{66288870DBDE2762}" {
   m_sName "The Year of Collapse"
   m_sDesc "By 2016 the Zone is a graveyard of broken factions and shattered loyalties. The remnants of Clear Sky finally met their end when a catastrophic surge of anomalies swept through their hidden bases. Their surviving scouts were scattered, their knowledge lost, and their dream of understanding the Zone died with them. The scientific age of the Zone has officially ended, leaving only those who fight to shape its future by force."\
   ""\
   "Freedom suffered heavy losses after Monolith assaults from the north began pushing deeper into the south. Grim, a respected leader, was killed during a desperate defense. Platform and Fox soon disappeared, either dead or lost in the wilderness. With leadership in ruins and morale low, Freedom struggled to hold the line. It was Father Goose who stepped forward and took command, determined to keep Vanya's ideals alive even as reality became harsher."\
   ""\
   "Duty faced its own downfall. Under the misguided leadership of Moron and Kali the faction nearly broke apart. Discipline crumbled, outposts were lost, and infighting spread like infection. But just as Duty seemed ready to collapse forever, Iron VW rose to power and began the difficult work of rebuilding. He promised order, structure, and a renewed crusade against the horrors of the Zone."\
   ""\
   "Meanwhile the Bandits only grew stronger. With Malenkov's bandits, like Frenchie, Polack, Orc, and Chalk, taking control of vital smuggling routes, they managed to force Duty back and keep them contained. Bandit war parties now roam freely, and they have become the dark arteries that the Zone beats through. Their dominance came at a cost, however. When a stalker known as Scar spoke too loudly about unifying Loners against Bandits, he was silenced permanently. His death frightened many and reminded everyone that resistance often ends in a shallow grave."\
   ""\
   "For Loners survival has never been more difficult. Monolith incursions strike at camps where stalkers once felt safe. Rumors claim the fanatics now possess a weapon that lets them sense outsiders from kilometers away. The Knights of the Zone have been meeting in secret as they search for ways to defend those who cannot defend themselves. Even they admit that without help they may not survive the year."\
   ""\
   "The Zone has entered a cruel era. Monolith terrorizes the south. Freedom struggles to protect stalkers. Duty claws its way back from near extinction. Bandits thrive in the chaos. Loners desperately cling to life any way they can. Every sunrise feels like borrowed time, and every sunset is a question of who will still be alive when the next blowout comes."
  }
  ARMST_PDA_WIKI_DATA "{6A0B77478186A583}" {
   m_sName "2017"
   m_sDesc "By 2016 the zone fell into collapse, with its key factions near obliteration and the monolithic power taking their place: Clear Sky is wiped out by catastrophic anomalies, ending hopes of understanding the Zone; Freedom is battered by Monolith assaults and leader losses, barely surviving under Father Goose’s command; Duty nearly implodes through failed leadership before Iron VW begins a hard rebuild; Bandits grow dominant by seizing smuggling routes and killing STALKERS; and STALKERS face constant threat from Monolith raids and rumoured new technology, relying on secretive defenders for survival. The Zone is now defined by fear, chaos, and shifting control, where every day feels temporary and the future is violently uncertain."\
   ""\
   "This was the case, before the Zone began to rekindle itself slowly, as more STALKER's began to band together in small, tight knit groups a safety ran through the lesser zone, charged by power of those who believed in a zone for all. The gritty hostility of the Lesser Zone crumbled as the Bandit presence began to lessen and lessen as more of them subdued to death. The infamous incursion of the north led by the great fathers of Svaboda led to a complete failure. Many of the old Svaboda members were killed in a last stand against the Monolith. A pyrrhic victory for a footstep in the zone, but ultimately a total failure to dismantle the Monolith. Father Goose was found later, rotted in an apartment. His PDA held the last notes of Svaboda, and new leaders began to rekindle the endeavours of the faction hereafter, the Kommandant took place, and led freedom to a now stable and victorious state, looking to avenge their founding fathers."\
   ""\
   "Dolg in their forever struggle had many different changes in Leadership and Location, settling once at the old and uninhabitable Uradnik Plant, they fell silenced to mutant hordes and Monolith raids, so they began to pitch up and head to the backside of the Radar Station, where a large cliff had erected from the ground in a tectonic shift. This, and the foundation of a new leader after an infamous Polish dictator had been dethroned, Morozov took lead and began to publish propaganda via the PDA of his new stance in the zone. Dolg now stands strong in the eyes of STALKER's, but still has a bad standing on the Lesser Zone for their once bandit like actions under the leadership of the previous Dictator."\
   ""\
   ""\
   "Small groups began to form in the now semi-safe Lesser Zone, an infamous character known for his knightly talk and ettiquete rose to arms with his small group, calling for exploration and adventure. And 'Chivalry' was raised, a cult-like band of STALKER's who swore adventure. In inspiration, multiple other groups began their startup. Sojourn in their early days was a small but humble group of STALKER's wishing to make the Zone a better place, and thus, they formed arms swearing to protect STALKER's from the horrible circumstances in the zone. Many more followed, and many more have the chance to transform the Zone in its entirety with their actions."\
   ""\
   ""\
   "It looked like things were on the rise, more stability and the Monolith pushed back to the North. Until, an announcement was made by Dolg over the PDA stating that they had newfound information that a Psi Tower was being cosntructed in Uradnik, for once, every faction existing took arms one way or another. The bloody battle of the Uradnik Plant is a horror that settles in many STALKER's minds that were lucky enough to live it, death, explosions and cries for help echo in STALKER's minds as they remember the fatality that occured that day. And then there was silence."
  }
 }
}