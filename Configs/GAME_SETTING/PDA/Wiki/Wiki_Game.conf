ARMST_PDA_WIKIConfig {
 m_WikiData {
  ARMST_PDA_WIKI_DATA "{65B4A2B601A44439}" {
   m_sName "HUNGER & THIRST"\
   ""
   m_sDesc "Survival in the Zone isn't just about mutants and anomalies, your own body is a threat if you neglect it. Hunger and thirst drain steadily over time, and letting either run out doesn't just weaken a stalker, it kills, starvation and dehydration are just as fatal as a bullet if ignored long enough. Managing both means keeping food and water stocked and eating or drinking before the meters bottom out, not after, since by the time the warnings turn urgent there's often little time left to fix it. It's an unglamorous danger compared to anomalies and mutants, but it's a constant one, the Zone doesn't need a monster to kill a careless stalker, sometimes an empty canteen is enough."
  }
  ARMST_PDA_WIKI_DATA "{65B4A2B60B97B191}" {
   m_sName "RADS"\
   ""
   m_sDesc "Rads are the running tally of radiation exposure a stalker's body accumulates, separate from the radiation zones themselves, think of the zone as the hazard and rads as the damage it leaves behind in your system. Every second spent in an irradiated area adds to that count, and unlike a wound that stops bleeding once treated, rads sit in your body and keep draining health passively until they're actually purged, not just avoided. Anti-rad drugs and vodka are the standard cure, flushing accumulated rads out of your system, while things like radiation-resistant suits and artifacts help slow how fast new rads build up in the first place. The danger with rads is how sneaky they are, a stalker can walk out of a hot zone feeling fine and still end up dying an hour later from exposure they never treated, which is why checking your PDA's rad meter is as important as checking your health bar."
  }
  ARMST_PDA_WIKI_DATA "{65B4A2B60C01B555}" {
   m_sName "TOXIC"
   m_sDesc "Toxicity works a lot like rads but for poison instead of radiation, a buildup meter tracking how much contamination a stalker's body has absorbed from chemical zones, Jelly puddles, tainted water, or spoiled food and drink. It doesn't spike and vanish the moment you step out of a hazard, it accumulates, and once toxicity gets high enough it starts draining health steadily until it's treated, not just avoided. Anti-toxin meds or specific consumables are usually the fix, purging what's built up the same way anti-rad drugs flush out radiation exposure. The trap most stalkers fall into is treating a quick dash through a chemical zone as \"safe\" because nothing happened immediately, when really the toxicity was quietly stacking up the whole time, waiting to become a problem after they've already moved on."
  }
  ARMST_PDA_WIKI_DATA "{65B4A2B610662EEA}" {
   m_sName "PSY"
   m_sDesc "Psy tracks the toll the Zone's psychic phenomena take on a stalker's mind, the same way rads track radiation and toxicity tracks poison, except what's building up here is mental strain instead of physical damage. Psi fields, Eye anomalies, and lingering exposure to the Zone's stranger corners all add to it, and once psy gets high enough it starts causing real problems, disorientation, hallucinations, and in severe cases outright loss of control, on top of draining health the longer it's left unchecked. Psi-protection gear and specific anti-psy meds are the standard countermeasures, either slowing the buildup before it happens or purging what's already accumulated. It's the least predictable of the three meters, since the effects hit your perception and judgment rather than just your health bar, which makes a stalker with high psy dangerous to themselves in ways rads and toxicity never are."
  }
  ARMST_PDA_WIKI_DATA "{65B4A2B61F9D8065}" {
   m_sName "EMISSION"
   m_sDesc "The Zone's heartbeat, a massive, Zone-wide release of energy that sweeps across the map periodically, and the one event every stalker plans their entire day around. Unlike a single anomaly, an Emission doesn't care where you are or what you're doing, the sky darkens, a warning shockwave rolls out ahead of it, and anyone caught in the open when it hits faces damage severe enough to be fatal without solid cover. Stalkers track Emissions obsessively through their PDA, treating the countdown as a hard deadline to reach a basement, bunker, or any enclosed shelter before the wave arrives. They're also one of the few times the Zone resets and shifts, anomalies can move, mutants scatter, and artifacts sometimes form in the aftermath, which means the same event that can kill you outright is also one of the best reasons to go looking for what it left behind."
  }
  ARMST_PDA_WIKI_DATA "{690913EC852983BB}" {
   m_sName "ACID RAIN"
   m_sDesc "A weather event rather than a fixed hazard, acid rain sweeps across the Zone in sudden downpours that corrode gear and burn exposed skin the longer a stalker stays out in it. Unlike an Emission, there's no shockwave warning, just darkening clouds and the first stinging drops, which means catching one out in the open usually comes down to how closely you've been watching the sky rather than your PDA. It's rarely lethal on its own the way an Emission is, but it steadily eats away at armor durability and health if you're caught without cover, making an already bad situation worse if it hits mid-firefight or deep in hostile territory. Most stalkers treat acid rain the same way they'd treat any storm, find an overhang, a building, anything with a roof, and wait it out rather than push through it."
  }
 }
}