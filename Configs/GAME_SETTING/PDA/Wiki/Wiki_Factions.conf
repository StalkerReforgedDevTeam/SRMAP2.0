ARMST_PDA_WIKIConfig {
 m_WikiData {
  ARMST_PDA_WIKI_DATA "{65B47A4D0A2E0A23}" {
   m_sName "Loners"
   m_sDesc "No banner, no chain of command, no cause worth dying for except the two or three people standing next to you. Most started as treasure hunters working the anomaly fields, though you'll find ex-military, rogue scientists, and desperate wanderers among them too. Reputation is everything out here, a stalker with a bad name doesn't last long, so most Loners deal fair even if they'll work for anyone willing to pay."
  }
  ARMST_PDA_WIKI_DATA "{65F6CE44DFAFCED8}" {
   m_sName "Monolith"
   m_sDesc "Once stalkers. Not anymore."\
   "Everyone in Monolith went deep enough to hear it speak, and came back rebuilt around total devotion to whatever lives at the heart of the Zone. They don't retreat, don't negotiate, and don't fear death, because whatever they saw in there already showed them something past it. To Monolith, every other faction is trespassing on holy ground."
   Icon "{77D1D73C132038FB}Assets/Textures/Icons/monoicon.edds"
  }
  ARMST_PDA_WIKI_DATA "{65B4A2B0E2A7217D}" {
   m_sName "Freedom"
   m_sDesc "The Zone belongs to no one, that's the whole philosophy. Freedom is loud, chaotic, and young where Duty is quiet and regimented, throwing parties in their strongholds one night and holding the line against outside forces the next. Don't mistake the noise for weakness. They believe in the Zone's raw freedom hard enough to die for it."
   Icon "{378167D975513956}Assets/Textures/Icons/freedomicon.edds"
  }
  ARMST_PDA_WIKI_DATA "{65B4A2B2CD9D147D}" {
   m_sName "Bandits"
   m_sDesc "No code, no contracts, no loyalty beyond the next score. Bandits are the Zone's predators, ambushing trade routes, shaking down Loners, and looting whoever's too weak to fight back. They're not organized like Duty or disciplined like Mercs, just armed opportunists running in loose packs, but that unpredictability makes them dangerous in a different way, you never know if a Bandit crew wants your gear, your stash, or just to watch you run. Most stalkers agree on one thing: there's no such thing as a good Bandit, only ones you haven't crossed yet."
   Icon "{96D3A545173A1ED8}Assets/Textures/Icons/banditicon.edds"
  }
  ARMST_PDA_WIKI_DATA "{65B4A2B2E2B2946A}" {
   m_sName "UKM"
   m_sDesc "The official face of Zone containment, UKM holds the perimeter and enforces the exclusion zone with the full weight of a standing army behind it. Checkpoints, patrols, and quarantine lines are their domain, and unlike the factions living inside the Zone, UKM answers to a chain of command that goes all the way back to a government trying to keep the whole disaster contained and out of the news. To most stalkers they're less an enemy than an obstacle, a wall of soldiers and paperwork standing between the outside world and the fortune waiting past the checkpoint, and getting past them alive is usually step one of becoming a stalker in the first place."
  }
  ARMST_PDA_WIKI_DATA "{65B4A2B2EC91F742}" {
   m_sName "Ecologists"
   m_sDesc "Scientists first, survivors second, the Ecologists are here to study the Zone, not conquer it or exploit it. Working out of research stations and mobile labs, they track anomaly behavior, catalog artifact properties, and try to make sense of a place that actively resists being understood. Most are unarmed or lightly equipped, relying on stalkers and mercenaries for protection while they chase data other factions couldn't care less about. They're neutral to almost everyone, trading knowledge and gear for safe passage and specimens, and most stalkers leave them alone since a dead Ecologist means no more upgrades, detectors, or artifact research for anybody."
  }
  ARMST_PDA_WIKI_DATA "{65FD16AEEB198B42}" {
   m_sName "Duty"
   m_sDesc "\"The Zone is a wound. We're the ones holding pressure on it.\""\
   "Ex-military and disciplined idealists who believe the Zone is an abomination that needs to be contained, studied under control, and eventually shut down for good. They run like a real army, ranks, orders, formation, and they treat the Zone as a threat to the outside world rather than a place to exploit. Duty doesn't forgive stalkers who profit off the Zone's dangers, and they'll say so to your face."
   Icon "{7190C4317BE8EF18}Assets/Textures/Icons/dutyicon.edds"
  }
  ARMST_PDA_WIKI_DATA "{663E9C453E0E421B}" {
   m_sName "MUTANTS"
   m_sDesc "Not a faction, a warning. The Zone didn't just twist the land, it twisted everything living in it, and what crawls out of the anomaly fields now barely resembles the animals they used to be. Some hunt in packs, some ambush from cover, some don't hunt at all and just exist as walking hazards you route around, but all of them share one trait: the Zone made them worse than nature ever intended. Stalkers don't negotiate with mutants, they survive them, and every faction from Loners to Monolith agrees on that much even when they agree on nothing else."
   Icon "{98A6DD41C96C2A81}UI/PDA/wiki/mutants/mut_boar.edds"
  }
  ARMST_PDA_WIKI_DATA "{65B4A2B2A79077DA}" {
   m_sName "Blue Eagles"
   m_sDesc "Guns for hire, plain and simple, professionals who treat the Zone like any other job site with better pay and worse odds. No ideology, no attachment to any cause, they'll escort a scientist, guard a stash, or gun down a rival faction depending on who's writing the check that week. What separates them from Bandits is discipline, Mercs run tight, well-equipped units with real tactics and real gear, and they honor a contract once it's signed because a mercenary outfit that breaks deals doesn't get hired again. Cold, efficient, and impossible to predict beyond one rule: money talks."
  }
  ARMST_PDA_WIKI_DATA "{65C4789FD99A67BF}" {
   m_sName "Admins/Staff"
   m_sDesc "Not stalkers, not a faction, not even part of the Zone's ecosystem, the Admins are the ones keeping the lights on behind it. They don't roam the map chasing artifacts or holding territory, but their word overrides everyone else's, server rules, enforcement, and the occasional unexplained event that no in-universe faction could ever cause. Most players never interact with them directly unless something's gone wrong or they need help, but every stalker in the Zone is, whether they realize it or not, playing by the Admins' rules first and the Zone's second."
  }
 }
}