ARMST_PDA_WIKIConfig {
 m_WikiData {
  ARMST_PDA_WIKI_DATA "{65B47A4BAF86D3F4}" {
   m_sName "Radiation"
   m_sDesc "Invisible, patient, and utterly indifferent to whether you're a hardened stalker or a fresh rookie, radiation is one of the Zone's oldest threats and still one of its deadliest. It pools in hotspots scattered across the map, some marked by rusted warning signs, others hidden until your detector starts ticking, and lingers around old reactor sites and certain anomaly clusters long after the initial disaster that caused it. Prolonged exposure eats away at your health steadily rather than all at once, which makes it deceptive, you can wander into a hot zone feeling fine and stumble out already dying if you're not watching your geiger counter. Vodka, anti-rad meds, and a healthy respect for your PDA's radiation reading are the only things standing between a stalker and a slow, ugly death nobody saw coming."
  }
  ARMST_PDA_WIKI_DATA "{65B4A2B39877F108}" {
   m_sName "CHEMICAL ZONES"
   m_sDesc "Where radiation kills you slow, chemical zones don't bother waiting. These are pockets of the Zone soaked in toxic runoff and industrial contamination, old plant sites and sludge-filled basins where whatever leaked here never stopped leaking. Exposure doesn't need time to build up, a lungful of the wrong air or a wrong step into contaminated water can drop a stalker fast, so gas masks or hazmat gear aren't optional if you're pushing through one. They're usually easier to spot than radiation, discolored water, dead vegetation, a haze in the air, but that visibility doesn't make them any less lethal to stalkers who get careless or run out of filters at the wrong moment."
  }
  ARMST_PDA_WIKI_DATA "{65B4A2B3956F2713}" {
   m_sName "PSI FIELDS"
   m_sDesc "Radiation attacks the body, psi fields attack the mind. These are zones where the Zone's psychic energy bleeds into the air, causing disorientation, hallucinations, and in the worst pockets outright madness for any stalker unlucky enough to wander in unprotected. Some psi fields are steady and mapped, others pulse or shift unpredictably, and without a psi-protection helmet or the right meds you'll start seeing and hearing things that aren't there long before the damage becomes physical. Stalkers treat psi fields with a different kind of fear than radiation or chemical zones, because what they take from you isn't just your health, it's your ability to trust your own senses while you're trying to survive."
  }
  ARMST_PDA_WIKI_DATA "{65B4A2B3E7531D80}" {
   m_sName "ROOTS"
   m_sDesc "Not every threat in the Zone shoots at you, some just grow. Roots are dense tangles of thorned, overgrown plant matter that choke off certain paths and clearings, snagging and tearing at any stalker who tries to push through without caution. They're less deadly than radiation or psi fields on their own, but that's what makes them dangerous, roots slow you down and box you in exactly where something worse might be waiting, and bleeding out from a dozen thorn cuts is just as fatal as any bullet if you're careless enough to let it happen. Most stalkers learn fast to route around a root patch rather than force their way through it, treating them less like plants and more like the Zone's way of telling you to go somewhere else."
  }
  ARMST_PDA_WIKI_DATA "{65F7099F424399D1}" {
   m_sName "ELECTRIC ANOMALIES"
   m_sDesc "Small pools of crackling energy scattered across the Zone, easy to miss until your detector starts screaming or you're already standing in one. Unlike the roaming or bursting anomalies elsewhere in the Zone, these sit in place, quiet puddles of distorted air that discharge the moment something triggers them, stalker, mutant, or stray piece of metal alike. They're rarely worth the risk to cross carelessly, but they're also some of the best places to find valuable artifacts, since the energy that makes them lethal is the same energy that forms and holds the artifacts inside them. Most stalkers navigate around the edges, bolt in fast when the discharge cycle allows, and get out before the next arc."
  }
  ARMST_PDA_WIKI_DATA "{65B4A2B3E9C37CF1}" {
   m_sName "EYE ANOMALIES"
   m_sDesc "A strange, watchful pocket of distortion that sits dormant until a stalker gets too close, at which point it activates and lashes out at the mind rather than the body. Getting caught in one doesn't burn or shock you like other anomalies, it hits your psi, leaving you disoriented and vulnerable in the same way a psi field does, just concentrated into one sudden spike instead of a slow drain. Stalkers who've encountered one describe a feeling of being watched right before it triggers, whether that's the anomaly itself or just nerves is up for debate, but either way the smart move is spotting it early and giving it a wide berth rather than testing how bad the psi hit really is."
  }
  ARMST_PDA_WIKI_DATA "{65C4693ECE7A9686}" {
   m_sName "GLASSES"
   m_sDesc "A cluster of glass shards suspended in the air, hanging motionless until something disturbs them, then whipping outward in every direction at once. Unlike most anomalies that punish carelessness with a single hazard, Glasses shred anything caught inside their radius, turning a careless approach into a dozen small cuts that add up fast if you don't back off immediately. They're usually easy to spot glinting in the light even from a distance, which makes them more of a navigation hazard than a genuine threat, stalkers who keep their eyes up rarely get caught by one, it's the ones staring at their PDA who learn the hard way."
  }
  ARMST_PDA_WIKI_DATA "{65B4A2B3F36D8A22}" {
   m_sName "GRAVI"
   m_sDesc "A gravitational anomaly that lies still until something crosses into its pull, then yanks whatever triggered it into the air before slamming it back down or crushing it outright under sudden, violent g-force. In the games these are some of the most feared anomalies precisely because they're near-instant kills, no slow drain like radiation or psi, just a sudden pull and a body hitting the ground wrong. They're often marked by floating debris or a faint distortion in the air where the gravity well sits, and experienced stalkers test suspicious ground with a thrown bolt before ever walking through, since a Gravi anomaly rarely gives you a second warning."
  }
  ARMST_PDA_WIKI_DATA "{65C2C991FB146D13}" {
   m_sName "GRINDER"
   m_sDesc "An anomaly that doesn't just kill, it mangles, pulling anything caught inside into a violent, churning field that tears bodies apart the way its name suggests. There's no subtlety to a Grinder, no slow buildup like radiation or psi, just a sudden pull followed by a death so brutal that stalkers use the aftermath as a grim landmark for where not to walk. They're usually found in tight, debris-choked spaces where the pull has nowhere to dissipate, and the telltale sign is the mess left behind, scattered gear and worse from whoever found it the hard way first. Bolt-testing isn't optional around a suspected Grinder, it's the only thing standing between curiosity and becoming the next warning sign."
  }
  ARMST_PDA_WIKI_DATA "{65B6BD341450D434}" {
   m_sName "ZERO GRAVITY FIELD"
   m_sDesc "A patch of the Zone where gravity simply switches off, sending anything nearby, debris, gear, unlucky stalkers, drifting weightlessly the moment they enter it. It's disorienting more than instantly lethal, but that's the danger, floating helplessly with no footing leaves a stalker unable to react fast enough if something else finds them mid-drift, or if the field destabilizes and drops everything back to the ground at once. Easy to spot from a distance thanks to the debris hanging suspended in place, and just as easy to avoid, most stalkers treat it as a curiosity to look at rather than a shortcut worth testing."
  }
  ARMST_PDA_WIKI_DATA "{65B4A2B3F84AD28D}" {
   m_sName "TRAMPOLINE"
   m_sDesc "An anomaly that does exactly what the name implies, catch its pull and it launches you skyward, sometimes hard enough to turn a straightforward crossing into a very short flight and a very bad landing. It's less about the launch itself and more about what comes after, fall damage doesn't care that an anomaly threw you, and a Trampoline dropped in the wrong spot, near rocks, water, or a drop-off, turns a weird encounter into a fatal one fast. Stalkers usually clock them by the faint shimmer or bounce in loose debris nearby, and while some treat them as a shortcut across rough terrain, most agree it's a gamble that isn't worth the fall."
  }
  ARMST_PDA_WIKI_DATA "{65B4A2B382B57661}" {
   m_sName "TELEPORT"
   m_sDesc "A rare and unpredictable anomaly that instantly relocates anything caught in its field to another point in the Zone, sometimes a short, harmless jump, sometimes straight into the middle of another anomaly or a spot with no way back out. Unlike most anomalies that punish you on the spot, a Teleport's real danger is entirely in where it sends you, which makes it one of the few hazards stalkers can't really prepare for beyond avoiding it outright. They're notoriously hard to detect compared to other anomalies, giving little to no warning before triggering, which has earned them a reputation as one of the more feared and least understood phenomena in the Zone."
  }
  ARMST_PDA_WIKI_DATA "{660AE2CEF0B00739}" {
   m_sName "MIRACLE"
   m_sDesc "An anomaly that looks almost peaceful compared to the rest of the Zone's hazards, a soft glow of white and blue that draws stalkers in with the promise of something good. And it isn't lying, exactly, standing inside a Miracle steadily heals the body, closing wounds and restoring health in a way nothing else in the Zone offers for free. The cost is what makes it dangerous, that same glow that mends flesh chips away at your mind, and a stalker who lingers too long chasing the healing effect can walk out physically fine and mentally worse for it. Most stalkers treat Miracle anomalies as a calculated risk rather than a free heal, dip in, take what you need, and get out before the psi damage outweighs whatever you gained."
  }
  ARMST_PDA_WIKI_DATA "{65B4A2B3846A826E}" {
   m_sName "JELLY"
   m_sDesc "A thick, glistening puddle of toxic goo that sits low to the ground, easy to mistake for harmless sludge until you're already standing in it. Unlike a chemical zone's lingering haze, Jelly's danger is concentrated and immediate, step in and the toxins go to work fast, and the deceptively small footprint of the puddle makes it easy for a distracted stalker to clip the edge without noticing until the damage starts. It's usually found pooling in low ground, basements, and drainage areas where runoff naturally collects, and the smart move is the same as with any goo in the Zone, if it's glistening and it's not water, walk around it."
  }
  ARMST_PDA_WIKI_DATA "{65B4A2B3A1CC728A}" {
   m_sName "FRYING"
   m_sDesc "An anomaly that superheats the air around it in sudden, scorching bursts, less a fire than a wave of concentrated heat that cooks anything caught inside without warning. There's no gradual buildup like radiation, just a shimmer in the air and then a burst that can strip health fast if a stalker wanders in without noticing the distortion. Frying anomalies tend to cluster near industrial ruins and old furnace sites, fitting for something that turns the surrounding air into an oven, and they're usually spotted by the telltale heat-shimmer distorting the view just before the burst hits. Bolt-testing suspicious shimmer is standard practice, since a Frying anomaly rarely gives more than a split second of warning once triggered."
  }
  ARMST_PDA_WIKI_DATA "{65B4A2B38805C537}" {
   m_sName "FIRE BUBBLE"
   m_sDesc "A pocket of trapped flame anomaly that sits contained until disturbed, then erupts outward in a burst of fire that catches anything nearby off guard. It's more sudden than a Frying anomaly's heat wave, less a slow cook and more an ignition, ugly, immediate burn damage the moment a stalker or piece of debris crosses too close. The telltale sign is a faint orange shimmer or haze hanging in the air where the bubble sits, easy to miss if you're not watching for it, and painfully obvious once it goes off. Most stalkers give any suspicious heat-shimmer a wide berth by default, since the difference between a Fire Bubble and a Frying anomaly usually isn't worth finding out the hard way."
  }
  ARMST_PDA_WIKI_DATA "{661CCA649F888217}" {
   m_sName "MIDGE"
   m_sDesc "Not an anomaly in the traditional sense, more a living hazard, a dense, buzzing swarm of insects that clusters in the air and attacks anything that wanders too close. Unlike the Zone's environmental anomalies, Midge swarms move and react, drawn to motion and warmth, which makes them harder to simply route around once they've noticed you. The damage isn't as immediately lethal as something like a Grinder or Electric anomaly, but a stalker caught in a thick swarm with nowhere to retreat can still find themselves in serious trouble fast, especially if the swarm pushes them toward something worse. Most stalkers deal with Midge the same way they'd deal with any pack of mutants, spot it early, keep distance, and don't linger in the buzz longer than it takes to get clear."
  }
  ARMST_PDA_WIKI_DATA "{66B0A3914357EAB8}" {
   m_sName "SINCERITY"
   m_sDesc "An electric anomaly with a mind of its own, drifting and chasing rather than sitting still like most of the Zone's hazards. Where a normal electric puddle waits for you to walk into it, Sincerity closes the distance itself, arcing energy trailing as it floats after whatever's moving nearby, which makes outrunning one far harder than simply avoiding it. The discharge hits the same as any electric anomaly, sudden and dangerous at close range, but the real threat is the chase itself, a stalker who panics and runs blind risks stumbling into something worse while trying to shake it off. Most experienced stalkers don't try to outrun a Sincerity in a straight line, they break line of sight or put obstacles between themselves and it, since the anomaly's pursuit isn't infinite, just patient."\
   ""\
   ""
  }
  ARMST_PDA_WIKI_DATA "{66B0A391BC39C28B}" {
   m_sName "FIREBALL"
   m_sDesc "A fire anomaly that hunts instead of waits, drifting and chasing much like Sincerity does with electricity, except what trails behind it is heat and flame instead of arcs. It closes distance on anything moving nearby, forcing stalkers to break line of sight or duck behind cover rather than trying to outrun it directly, since a straight sprint just keeps you in its path. Contact hits like any fire-based anomaly, fast, brutal burn damage at close range, but the real danger is the same as Sincerity's, panicking and running blind while being chased is how stalkers end up backing into something worse. Most treat a Fireball the way they'd treat an aggressive mutant, break contact smart, don't just run."
  }
  ARMST_PDA_WIKI_DATA "{68A2A2C99AF87657}" {
   m_sName "EMISSION"
   m_sDesc "The Zone's heartbeat, a massive, Zone-wide release of energy that sweeps across the map periodically, and the one event every stalker plans their entire day around. Unlike a single anomaly, an Emission doesn't care where you are or what you're doing, the sky darkens, a warning shockwave rolls out ahead of it, and anyone caught in the open when it hits faces damage severe enough to be fatal without solid cover. Stalkers track Emissions obsessively through their PDA, treating the countdown as a hard deadline to reach a basement, bunker, or any enclosed shelter before the wave arrives. They're also one of the few times the Zone resets and shifts, anomalies can move, mutants scatter, and artifacts sometimes form in the aftermath, which means the same event that can kill you outright is also one of the best reasons to go looking for what it left behind."
  }
 }
}